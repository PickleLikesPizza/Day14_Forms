<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Truths and a Lie</title>
</head>
<body style="background-color:rgb(241, 222, 231)">
    <h1>Derek's Truth and Lie Game</h1>
    <hr>
    <h2>Introductions</h2>
    <form action="" id="name-form">
        <label for="fname">First Name:</label><br />
        <input type="text" name="fname" id="fname"><br />
        <label for="lname">Last Name:</label><br />
        <input type="text" name="lname" id="lname"><br />
        <label for="age">Age:</label><br />
        <input type="number" name="age" id="age"><br />
    </form>
    <input type="button" value="SUBMIT" onclick="greet();">
    <p id="greet" style="font-size: x-large;">Welcome!</p>

    <h2>Warm Up Trivia Question</h2>
    <p>What is the only food that cannot go bad?</p>
    <p id="trivia1-answer"></p>
    <form action="">
        <input type="radio" name="trivia1" id="chocolate">
        <label for="chocolate">Dark Chocolate</label><br />
        <input type="radio" name="trivia1" id="tuna">
        <label for="tuna">Tuna</label><br />
        <input type="radio" name="trivia1" id="honey">
        <label for="honey">Honey</label><br />
    </form>
    <input type="button" value="SUBMIT" onclick="trivia1();">

    <h2>Two Truths & One Lie</h2>
    <p>Which is not a fact about me?</p>
    <p id="ttaol1-answer"></p>
    <form action="">
        <input type="radio" name="ttaol1" id="truth1">
        <label for="truth1">I have two cats</label><br />
        <input type="radio" name="ttaol1" id="lie">
        <label for="lie">I can speak fluent French</label><br />
        <input type="radio" name="ttaol1" id="truth2">
        <label for="truth2">My favorite singer is Laufey</label><br />
    </form>
    <input type="button" value="SUBMIT" onclick="ttaol1();">

    <script src="javascript/truth.js"></script>

</body>
</html>
